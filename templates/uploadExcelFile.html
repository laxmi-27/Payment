{% extends 'base.html' %}
{% block content %}

<style>
/* ── Import Excel ─────────────────────────────────────────────────── */
.eu-page { max-width: 580px; margin: 0 auto; }

.eu-header {
  background: linear-gradient(135deg, #183b70, #2f68bb);
  border-radius: 18px; padding: 26px 32px; margin-bottom: 24px; color: #fff;
}
.eu-header h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
.eu-header p  { margin: 0; font-size: 13.5px; opacity: .82; }

.eu-card {
  background: #fff; border-radius: 18px;
  box-shadow: 0 4px 24px rgba(0,0,0,.07); padding: 32px;
}

/* Drop zone */
.eu-drop-zone {
  border: 2px dashed #2d73d5; padding: 44px 30px; border-radius: 16px;
  background: #f7fbff; cursor: pointer; transition: .3s; text-align: center; display: block;
}
.eu-drop-zone:hover, .eu-drop-zone.eu-drag-over {
  background: #eef5ff; border-color: #1d3e73; transform: translateY(-2px);
}
.eu-drop-zone i    { font-size: 54px; color: #2d73d5; margin-bottom: 14px; display: block; }
.eu-drop-zone h3   { color: #1d3e73; margin: 0 0 6px; font-size: 17px; }
.eu-drop-zone span { font-size: 13px; color: #888; }

#euFilename {
  margin-top: 14px; font-weight: 600; color: #1d3e73; font-size: 14px;
  background: #f0f7ff; padding: 10px 16px; border-radius: 8px;
  border: 1px solid #c9dffa; display: none; text-align: center;
}
#euFilename.eu-has-file { display: block; }

.eu-upload-btn {
  margin-top: 20px; width: 100%; padding: 14px;
  background: linear-gradient(90deg, #183b70, #2f68bb);
  color: #fff; border: none; border-radius: 10px;
  font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity .2s;
  display: flex; align-items: center; justify-content: center; gap: 9px;
}
.eu-upload-btn:hover   { opacity: .9; }
.eu-upload-btn:disabled { opacity: .45; cursor: not-allowed; }

.eu-ds-link {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 18px; font-size: 13.5px; color: #2f68bb; text-decoration: none; font-weight: 600;
}
.eu-ds-link:hover { text-decoration: underline; }

/* ── Duplicate modal ─────────────────────────────────────────────── */
.eu-overlay {
  display: none; position: fixed; inset: 0; z-index: 99990;
  background: rgba(10,20,50,.48); align-items: center; justify-content: center;
}
.eu-overlay.eu-open { display: flex; }
.eu-modal {
  background: #fff; border-radius: 18px; padding: 34px 28px;
  max-width: 430px; width: 94%;
  box-shadow: 0 20px 60px rgba(0,0,0,.22); text-align: center;
}
.eu-modal-icon { font-size: 42px; color: #f59e0b; margin-bottom: 14px; }
.eu-modal h3   { font-size: 18px; font-weight: 700; color: #1d3e73; margin: 0 0 8px; }
.eu-modal p    { font-size: 13.5px; color: #6b7280; margin: 0 0 24px; line-height: 1.6; }
.eu-modal-btns { display: flex; flex-direction: column; gap: 10px; }

.eu-mbtn {
  padding: 13px 16px; border-radius: 10px; font-size: 14px; font-weight: 600;
  cursor: pointer; border: 1.5px solid transparent; width: 100%;
  display: flex; align-items: flex-start; gap: 12px; text-align: left; transition: opacity .15s;
}
.eu-mbtn:hover { opacity: .88; }
.eu-mbtn i { font-size: 17px; margin-top: 1px; flex-shrink: 0; }
.eu-mbtn-body { display: flex; flex-direction: column; gap: 3px; }
.eu-mbtn-title { font-size: 14px; font-weight: 700; line-height: 1.2; }
.eu-mbtn-desc  { font-size: 12px; font-weight: 400; opacity: .72; }

.eu-mbtn.eu-replace  { background: #183b70; color: #fff; border-color: #183b70; }
.eu-mbtn.eu-newver   { background: #eef5ff; color: #1d3e73; border-color: #b8d0f0; }
.eu-mbtn.eu-reselect { background: #f5f5f5; color: #555;   border-color: #ddd; }

/* ── Toast ───────────────────────────────────────────────────────── */
.eu-toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1d3e73; color: #fff; padding: 13px 26px; border-radius: 10px;
  font-size: 14px; font-weight: 600; z-index: 999999;
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
  transition: transform .3s ease, opacity .3s ease; opacity: 0; pointer-events: none;
}
.eu-toast.eu-error { background: #c62828; }
.eu-toast.eu-show  { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>

<!-- Duplicate modal -->
<div class="eu-overlay" id="euOverlay">
  <div class="eu-modal">
    <div class="eu-modal-icon"><i class="fa fa-exclamation-circle"></i></div>
    <h3>File Already Exists</h3>
    <p id="euDupMsg">This file has already been uploaded. What would you like to do?</p>
    <div class="eu-modal-btns">

      <button class="eu-mbtn eu-replace" onclick="euSubmit('replace')">
        <i class="fa fa-sync-alt"></i>
        <div class="eu-mbtn-body">
          <span class="eu-mbtn-title">Replace Existing File</span>
          <span class="eu-mbtn-desc">Same filename — overwrite content with new data</span>
        </div>
      </button>

      <button class="eu-mbtn eu-newver" onclick="euSubmit('new_version')">
        <i class="fa fa-code-branch"></i>
        <div class="eu-mbtn-body">
          <span class="eu-mbtn-title">Upload as New Version</span>
          <span class="eu-mbtn-desc">Keep old file — save new copy (abc.xlsx → abc_2.xlsx)</span>
        </div>
      </button>

      <button class="eu-mbtn eu-reselect" onclick="euReselect()">
        <i class="fa fa-folder-open"></i>
        <div class="eu-mbtn-body">
          <span class="eu-mbtn-title">Re-select File</span>
          <span class="eu-mbtn-desc">Cancel and choose a different file</span>
        </div>
      </button>

    </div>
  </div>
</div>

<!-- Toast -->
<div class="eu-toast" id="euToast"></div>

<div class="eu-page">
  <div class="eu-header">
    <h1><i class="fa fa-file-excel"></i> Import Excel</h1>
    <p>Upload a payment data Excel file to preview and save records</p>
  </div>

  <div class="eu-card">
    <form id="euForm" enctype="multipart/form-data">

      <label class="eu-drop-zone" for="euFileInput"
        ondragover="event.preventDefault(); this.classList.add('eu-drag-over')"
        ondragleave="this.classList.remove('eu-drag-over')"
        ondrop="euDrop(event)">
        <i class="fa fa-cloud-upload-alt"></i>
        <h3>Click to Browse or Drag &amp; Drop</h3>
        <span>Supports .xlsx and .xls files</span>
      </label>

      <input type="file" id="euFileInput" name="file" accept=".xlsx,.xls"
        style="display:none" onchange="euFileChosen()">

      <div id="euFilename"></div>

      <button type="button" class="eu-upload-btn" id="euBtn" disabled
              onclick="euSubmit('new')">
        <i class="fa fa-upload"></i> Upload &amp; Preview
      </button>
    </form>

    <a href="/excel_history" class="eu-ds-link">
      <i class="fa fa-history"></i> View Excel History
    </a>
  </div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────────
   File-selection helpers
───────────────────────────────────────────────────────────────── */
function euFileChosen() {
  const inp = document.getElementById('euFileInput');
  const lbl = document.getElementById('euFilename');
  const btn = document.getElementById('euBtn');
  if (inp.files.length) {
    lbl.textContent = '✔  ' + inp.files[0].name;
    lbl.className = 'eu-has-file';
    btn.disabled = false;
  } else {
    lbl.textContent = '';
    lbl.className = '';
    btn.disabled = true;
  }
}

function euDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('eu-drag-over');
  if (e.dataTransfer.files.length) {
    document.getElementById('euFileInput').files = e.dataTransfer.files;
    euFileChosen();
  }
}

/* ─────────────────────────────────────────────────────────────────
   Main upload function — server decides if duplicate
   mode: 'new' | 'replace' | 'new_version'
───────────────────────────────────────────────────────────────── */
async function euSubmit(mode) {
  const inp = document.getElementById('euFileInput');
  if (!inp.files.length) return;

  /* Close modal first, set spinner */
  document.getElementById('euOverlay').classList.remove('eu-open');
  euSetBtn(mode === 'new' ? 'uploading' : 'saving');

  /* Build multipart form data */
  const fd = new FormData();
  fd.append('file', inp.files[0]);
  fd.append('mode', mode);

  let result;
  try {
    const r = await fetch('/upload_excel_file', {
      method: 'POST',
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
      body: fd
    });
    if (!r.ok) throw new Error('Server error ' + r.status);
    result = await r.json();
  } catch (err) {
    euSetBtn('ready');
    euToast('Upload failed. Please try again.', true);
    return;
  }

  /* ── Server says duplicate found (mode was 'new') ── */
  if (result.duplicate) {
    euSetBtn('ready');
    document.getElementById('euDupMsg').textContent =
      '"' + result.filename + '" already exists. What would you like to do?';
    document.getElementById('euOverlay').classList.add('eu-open');
    return;
  }

  /* ── Success ── */
  if (result.ok && result.redirect) {
    window.location.href = result.redirect;
    return;
  }

  /* ── Error from server ── */
  euSetBtn('ready');
  euToast(result.error || 'Upload failed. Please try again.', true);
}

/* ─────────────────────────────────────────────────────────────────
   Re-select: clear everything, close modal
───────────────────────────────────────────────────────────────── */
function euReselect() {
  document.getElementById('euOverlay').classList.remove('eu-open');
  document.getElementById('euFileInput').value = '';
  const lbl = document.getElementById('euFilename');
  lbl.textContent = '';
  lbl.className = '';
  document.getElementById('euBtn').disabled = true;
}

/* ─────────────────────────────────────────────────────────────────
   UI helpers
───────────────────────────────────────────────────────────────── */
function euSetBtn(state) {
  const btn = document.getElementById('euBtn');
  const labels = {
    uploading: '<i class="fa fa-spinner fa-spin"></i>&nbsp; Uploading...',
    saving:    '<i class="fa fa-spinner fa-spin"></i>&nbsp; Saving...',
    ready:     '<i class="fa fa-upload"></i> Upload &amp; Preview'
  };
  btn.disabled = (state !== 'ready');
  btn.innerHTML = labels[state] || labels.ready;
}

let _toastTimer;
function euToast(msg, isError) {
  const t = document.getElementById('euToast');
  t.textContent = msg;
  t.className = 'eu-toast' + (isError ? ' eu-error' : '');
  clearTimeout(_toastTimer);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('eu-show')));
  _toastTimer = setTimeout(() => t.classList.remove('eu-show'), 5000);
}
</script>

{% endblock %}
