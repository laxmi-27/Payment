{% extends 'base.html' %}
{% block content %}

<style>

.edit-wrapper{
max-width:720px;
margin:auto;
}

.edit-card{
background:#fff;
padding:45px;
border-radius:24px;
box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.edit-card h2{
font-size:32px;
color:#1d3e73;
margin-bottom:30px;
text-align:center;
}

/* Flash */
.flash-msg{
background:#e8f4ff;
border-left:5px solid #2f68bb;
padding:14px 18px;
margin-bottom:22px;
border-radius:12px;
font-weight:600;
color:#1d3e73;
}

/* Form */
.form-group{
margin-bottom:22px;
}

label{
display:block;
font-weight:600;
margin-bottom:10px;
color:#344054;
}

select,
input{
width:100%;
padding:14px 16px;
border:1px solid #d8dfeb;
border-radius:12px;
background:#fafcff;
outline:none;
font-size:15px;
transition:.3s;
}

select:focus,
input:focus{
border-color:#2d73d5;
background:#fff;
box-shadow:0 0 0 4px rgba(45,115,213,.08);
}

.button-row{
display:flex;
justify-content:center;
gap:18px;
margin-top:30px;
flex-wrap:wrap;
}

.update-btn{
background:linear-gradient(90deg,#183b70,#2f68bb);
color:white;
border:none;
padding:14px 34px;
border-radius:14px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.update-btn:hover{
transform:translateY(-3px);
box-shadow:0 8px 18px rgba(0,0,0,.12);
}

.cancel-btn{
background:#eef2f7;
color:#1d3e73;
padding:14px 34px;
border-radius:14px;
text-decoration:none;
font-weight:600;
}

@media(max-width:768px){

.edit-card{
padding:25px;
}

.button-row{
flex-direction:column;
}

.update-btn,
.cancel-btn{
width:100%;
text-align:center;
}

}

</style>


<script>
window.onload = function () {
const flash=document.getElementById('flash-message');
if(flash){
alert(flash.innerText);
}
}
</script>


<div class="edit-wrapper">

<div class="edit-card">

<h2>Edit Block</h2>


<!-- Flash -->
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category,message in messages %}
<div id="flash-message"
class="flash-msg">
{{ message }}
</div>
{% endfor %}
{% endif %}
{% endwith %}


<form method="POST">

<div class="form-group">
<label for="state_Id">
State
</label>

<select
name="state_Id"
id="state_Id"
required>

<option value="" disabled>
Select State
</option>

{% for state in states %}
<option
value="{{ state[0] }}"
{% if state[0] == block_data[1] %}
selected
{% endif %}
>
{{ state[1] }}
</option>
{% endfor %}

</select>
</div>



<div class="form-group">
<label for="district_Id">
District
</label>

<select
name="district_Id"
id="district_Id"
required>

<option value="" disabled>
Select District
</option>

{% for district in districts %}
<option
value="{{ district[0] }}"
{% if district[0] == block_data[2] %}
selected
{% endif %}
>
{{ district[1] }}
</option>
{% endfor %}

</select>

</div>



<div class="form-group">
<label for="block_Name">
Block Name
</label>

<input
type="text"
name="block_Name"
value="{{ block_data[0] }}"
placeholder="Enter Block Name"
required>

</div>


<div class="button-row">

<button
type="submit"
class="update-btn">
Update Block
</button>

<a href="/add_block"
class="cancel-btn">
Cancel
</a>

</div>

</form>

</div>
</div>

{% endblock %}
